name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character commit SHA; blank uses the current default-branch commit
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should_deploy: ${{ steps.classify.outputs.should_deploy }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Classify release commit
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail open: if the commit cannot be classified, deploy as before rather
          # than silently skipping a deploy for a real change.
          if ! message="$(gh api "/repos/$GITHUB_REPOSITORY/commits/$RELEASE_SHA" --jq '.commit.message' 2>/dev/null)"; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=commit classification unavailable; deploying" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          subject="${message%%$'\n'*}"
          release_subject_pattern='^chore\(release\):.*\[skip ci\]$'
          if [[ "$subject" =~ $release_subject_pattern ]]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=semantic-release version commit: $subject" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=application commit: $subject" >> "$GITHUB_OUTPUT"

  deploy:
    needs: classify
    if: >-
      needs.classify.outputs.should_deploy == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.commit || github.sha }}
    steps:
      - name: Validate release input
        shell: bash
        run: '[[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - name: Verify manual release passed CI
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=100" \
            --jq ".workflow_runs[] | select(.head_sha == \"$RELEASE_SHA\") | .id" | head -n 1)
          test -n "$run_id"
      - name: Install ephemeral SSH material
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          install -m 0600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          install -m 0600 /dev/null ~/.ssh/known_hosts
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
      - name: Deploy exact tested commit
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "sudo -n /usr/local/sbin/cloud-harness-deploy '$RELEASE_SHA'"
      - name: Remove SSH material
        if: always()
        shell: bash
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
