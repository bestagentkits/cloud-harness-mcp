name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name ==
      github.repository &&
      (github.event.workflow_run.head_branch == 'dev' ||
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # RELEASE_TOKEN is an owner-supplied fine-grained PAT whose owner has admin
      # rights on this repository. Branch protection cannot be bypassed by the
      # github-actions bot, so the release commit must be pushed by an identity
      # that can bypass it: with `enforce_admins: false`, an admin bypasses
      # required status checks. The default token is kept as a fallback so the
      # workflow still works when the secret is absent.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Confirm CI tested the current release-branch tip
        shell: bash
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$BRANCH" in dev|main) ;; *) exit 1 ;; esac
          current_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$current_sha" = "$RELEASE_SHA"
          git switch --force-create "$BRANCH" "$RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm ci
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          test "$(git branch --show-current)" = "$RELEASE_BRANCH"
          env -u GITHUB_ACTIONS npm exec semantic-release
      # The version commit carries [skip ci], so push CI never tests it and the
      # deploy that follows CI never sees it. Request CI for it explicitly: the
      # dispatched run is not a push, so Release skips it, and Deploy production
      # deploys the tagged tree once that run passes. The PAT is preferred
      # because its dispatch behaves like an owner's; the workflow token is the
      # fallback when the PAT is absent or lacks Actions write access.
      - name: Request CI for the release commit
        if: github.event.workflow_run.head_branch == 'main'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          if [[ "$release_commit" == "$RELEASE_SHA" ]]; then
            echo "No version commit was created; push CI already deployed $RELEASE_SHA."
            exit 0
          fi
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$main_sha" != "$release_commit" ]]; then
            echo "::notice::main moved to $main_sha after release commit $release_commit; that push's CI deploys both."
            exit 0
          fi
          for token in "$RELEASE_TOKEN" "$WORKFLOW_TOKEN"; do
            [[ -n "$token" ]] || continue
            if GH_TOKEN="$token" gh workflow run ci.yml --ref main --repo "$GITHUB_REPOSITORY"; then
              echo "Requested CI for release commit $release_commit."
              exit 0
            fi
          done
          echo "::error::Could not request CI for release commit $release_commit. Run: gh workflow run ci.yml --ref main"
          exit 1
