services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set for cloudflare tunnel ingress}
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - ingress
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
          pids: 64
