server {
    listen 80;
    listen [::]:80;
    server_name cloud-harness-mcp.46-250-239-227.sslip.io;

    client_max_body_size 1m;

    location = /healthz {
        proxy_pass http://127.0.0.1:3100/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:3100/readyz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:3100/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location ^~ /mcp/workspaces/ {
        proxy_pass http://127.0.0.1:3100/mcp/workspaces/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location = /mcp-gateway {
        proxy_pass http://127.0.0.1:3100/mcp-gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location = /mcp-api-key {
        proxy_pass http://127.0.0.1:3100/mcp-api-key;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location = /mcp-api-key/gateway {
        proxy_pass http://127.0.0.1:3100/mcp-api-key/gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # Public automation webhook ingress (mounted by the API only when automations are enabled).
    # The runner verifies each delivery's signature over the exact raw body.
    location ^~ /integrations/webhooks/ {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3100/integrations/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The downstream MCP OAuth callback carries a one-time authorization code and state
    # in its query string; keep both out of the access log.
    location = /dashboard/mcp-oauth/callback {
        access_log off;
        proxy_pass http://127.0.0.1:3100/dashboard/mcp-oauth/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /dashboard {
        proxy_pass http://127.0.0.1:3100/dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /dashboard/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:3100/dashboard/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
