services:
  api:
    env_file: ${CLOUD_HARNESS_ENV_FILE:-/etc/cloud-harness-mcp/runtime.env}
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M, pids: 128 }

  ingress:
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M, pids: 64 }


  provisioning-proxy:
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M, pids: 64 }
  runner:
    env_file: ${CLOUD_HARNESS_ENV_FILE:-/etc/cloud-harness-mcp/runtime.env}
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G, pids: 256 }
    volumes:
      - /etc/cloud-harness-mcp:/run/cloud-harness-secrets:ro

  model-gateway:
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M, pids: 128 }
    volumes:
      - /etc/cloud-harness-model-gateway/profiles.json:/run/model-gateway-config/profiles.json:ro
      - /etc/cloud-harness-model-gateway/provider-api-key:/run/model-gateway-secrets/provider-api-key:ro
  # Keep the locally-built executor and agent images referenced by running
  # containers so a host `docker image prune -a` / `docker system prune -a`
  # cannot delete them between operations. Those images only ever run as
  # short-lived per-workspace or per-agent containers, so without a standing
  # reference they are "unused" and a prune removes them, breaking
  # workspace_open or agent_spawn until the next deploy. Each idle holder is
  # strictly less privileged than the containers it keeps referenced: no
  # network, no mounts, no secrets, all capabilities dropped, read-only,
  # non-root.
  executor-image-keepalive:
    image: cloud-harness-executor:local
    command: ["sleep", "infinity"]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "1" }
    deploy:
      resources:
        limits: { cpus: "0.01", memory: 32M, pids: 8 }

  agent-image-keepalive:
    image: cloud-harness-agent:local
    # The agent image's entrypoint starts the agent runtime, which would treat a
    # command as its own arguments and exit; replace the entrypoint so the
    # container only idles to keep the image referenced.
    entrypoint: ["/sbin/tini", "--", "sleep", "infinity"]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: 1m, max-file: "1" }
    deploy:
      resources:
        limits: { cpus: "0.01", memory: 32M, pids: 8 }
